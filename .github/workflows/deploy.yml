# Nome del Workflow
name: Deploy VitePress site to Pages

on:
  # Esegue lo script ogni volta che fai un "push" sul branch main
  push:
    branches: [main]

  # Permette di avviare il deploy manualmente dalla scheda "Actions"
  workflow_dispatch:

# Imposta i permessi necessari per permettere a GitHub Actions di pubblicare su Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Impedisce deploy multipli contemporanei
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job di compilazione (Build)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessario se usi la funzione "last updated" di VitePress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build with VitePress
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist # La cartella dove VitePress genera i file statici

  # Job di pubblicazione (Deploy)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4